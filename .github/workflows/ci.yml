name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install clang-18 and project dev dependencies
        run: |
          if ! command -v clang-18 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18
          fi
          python3 -m pip install --upgrade pip
          pip install -e ".[dev,gcp]"

      - name: Run Ruff lint
        run: ruff check src/ tests/ benchmarks/ .github/scripts/

      - name: Run Mypy strict typecheck
        run: mypy --strict src/

      - name: Run Pytest suite
        run: pytest -v --tb=short

      - name: Run benchmark threshold check
        run: PYTHONPATH=src python benchmarks/bench_astraea.py --check-thresholds
